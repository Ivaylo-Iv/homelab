apiVersion: apps/v1
kind: Deployment
metadata:
  name: fgcl
  namespace: fgcl
  labels:
    app: fgcl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fgcl
  template:
    metadata:
      labels:
        app: fgcl
    spec:
      containers:
        - name: fgcl
          image: ghcr.io/ivaylo-iv/lottery-draw:latest
          ports:
            - containerPort: 3000
